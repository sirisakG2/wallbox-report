<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <title>Wall Box Records · Xpeng Thailand</title>
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="icon" type="image/png" href="/assets/xpeng-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" defer></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div id="loginScreen" class="login-screen" hidden>
    <form class="login-card" id="loginForm" autocomplete="on">
      <img src="/assets/xpeng-logo.png" alt="XPENG" class="login-logo">
      <h1>Xpeng Thailand</h1>
      <p>Wall Box Installation Records</p>
      <input type="text" name="username" value="admin" autocomplete="username" hidden>
      <div class="field"><label for="password">Admin password</label>
        <input class="input lg" type="password" id="password" name="password" autocomplete="current-password" required autofocus></div>
      <div class="login-error" id="loginError" hidden></div>
      <button class="btn primary lg" type="submit" id="loginBtn" style="width:100%;justify-content:center">Sign in</button>
    </form>
    <div class="login-foot">Aum · Xpeng (Thailand)</div>
  </div>

  <div id="updateBanner" class="update-banner" hidden>
    A new version of the app is available.
    <button class="btn sm" onclick="location.reload()">Refresh</button>
  </div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="/assets/xpeng-logo.png" alt="XPENG">
        <div class="brand-divider"></div>
        <div class="brand-text">
          <strong>Xpeng Thailand</strong>
          <span>Wall Box Installation Records</span>
        </div>
      </div>
      <div class="topbar-spacer"></div>
      <span class="env-chip" id="userChip"><span class="dot"></span>Admin</span>
      <button class="btn sm" id="logoutBtn" title="Sign out">Sign out</button>
      <button class="icon-btn" id="themeToggle" title="Switch light / dark theme" aria-label="Switch theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <nav class="tabs">
      <div class="tabs-inner" id="tabs">
        <button class="tab" data-view="dashboard">Dashboard</button>
        <button class="tab tab-check" data-view="check-excel"><span class="tab-num">1</span><span class="tab-2l"><b>Excel Check</b><small>Excel rows ↔ PDFs in folder</small></span></button>
        <button class="tab tab-check" data-view="issues"><span class="tab-num">2</span><span class="tab-2l"><b>Issues <span class="count" id="cIssues">–</span></b><small>to fix or approve</small></span></button>
        <span class="tabs-spacer"></span>
        <button class="tab tab-side" data-view="records">PDF Data <span class="count" id="cRecords">–</span></button>
        <button class="tab tab-side" data-view="months">Months &amp; Import <span class="count" id="cMonths">–</span></button>
        <button class="tab tab-side" data-view="manual">📖 คู่มือ Manual</button>
      </div>
    </nav>
  </header>

  <main id="view"></main>

  <footer>
    <div class="footer-inner">
      <div><strong>Aum</strong><span class="sep">·</span>Xpeng (Thailand)</div>
      <div>
        App <code id="appVersion">v–</code><span class="sep">·</span>GitHub <a id="gitLink" href="#" target="_blank" rel="noopener"><code id="gitVersion">–</code></a>
      </div>
    </div>
  </footer>
</body>
</html>
